# GAMCS: run the frontend unit tests on every push to main. Upstream's
# frontend-tests.yml only runs on pull requests and is left untouched.
name: GAMCS CI
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: cd frontend && yarn install --frozen-lockfile
      - run: cd frontend && yarn test:run
